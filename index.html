<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedHot Bites | Food Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-neutral-900 text-white min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-red-900/30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-black text-red-600 tracking-wider">RED<span class="text-white">HOT</span> BITES</h1>
      <button id="cartBtn" class="relative bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-full font-bold transition flex items-center gap-2">
        <i class="fa-solid font-bold fa-cart-shopping"></i> Cart
        <span id="cartBadge" class="bg-white text-red-600 text-xs px-2 py-0.5 rounded-full font-extrabold">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-b from-black to-neutral-900 text-center py-12 px-4 border-b border-neutral-800">
    <h2 class="text-4xl md:text-5xl font-black mb-3">Craving <span class="text-red-500">Delicious</span> Food?</h2>
    <p class="text-neutral-400 text-lg">Freshly prepared, red-hot dishes delivered straight to your door.</p>
  </section>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-10 flex-1 w-full">
    <h3 class="text-2xl font-bold mb-6 border-l-4 border-red-600 pl-3">Popular Menu</h3>
    <div id="foodGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="bg-neutral-900 w-full max-w-md h-full flex flex-col border-l border-neutral-800">
      <div class="p-4 border-b border-neutral-800 flex justify-between items-center bg-black">
        <h3 class="text-xl font-bold">Your Cart</h3>
        <button id="closeCart" class="text-neutral-400 hover:text-white text-2xl">&times;</button>
      </div>

      <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

      <div class="p-4 border-t border-neutral-800 bg-black space-y-4">
        <div class="flex justify-between text-xl font-bold">
          <span>Total:</span>
          <span id="cartTotal" class="text-red-500">$0.00</span>
        </div>
        
        <!-- Checkout Form -->
        <form id="checkoutForm" class="space-y-3">
          <input type="text" id="custName" placeholder="Full Name" required class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm text-white focus:outline-none focus:border-red-600">
          <input type="text" id="custAddress" placeholder="Delivery Address" required class="w-full bg-neutral-800 border border-neutral-700 rounded p-2 text-sm text-white focus:outline-none focus:border-red-600">
          <button type="submit" id="placeOrderBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition text-center">Place Order</button>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
